name: Deploy to GitHub Pages

# Deploy only tagged releases (e.g. v0.1.0). Pushes to main are validated by
# ci.yml but never published, so the live site always maps to a tag.
on:
  push:
    tags: ['v*.*.*']
  # Manual escape hatch: picks whatever ref is selected in the UI.
  workflow_dispatch:

# Allow the workflow to publish to Pages and mint an OIDC token for deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release
        # Fails fast if a manual run was started from a non-tag ref, so the
        # published site can never be built from an arbitrary commit.
        run: |
          ref="$GITHUB_REF"
          if [ "${ref#refs/tags/v}" = "$ref" ]; then
            echo "::error::Pages deploys require a semver tag (refs/tags/v*), got $ref"
            exit 1
          fi
          echo "Deploying $ref"

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          # Enable Pages with the "GitHub Actions" source if it is not on yet
          # (needs the pages: write permission above).
          enablement: true

      - name: Build
        # vite.config.ts derives the base path from GITHUB_REPOSITORY.
        # BASE_PATH is left alone so the repo-derived default still wins.
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
